<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Space Grotesk"; src:url("../fonts/space-grotesk-500-normal.woff2") format("woff2"); font-weight:500; }
  @font-face { font-family:"Space Grotesk"; src:url("../fonts/space-grotesk-700-normal.woff2") format("woff2"); font-weight:700; }
  @font-face { font-family:"Noto Sans SC"; src:local("Noto Sans SC"); }
  @font-face { font-family:"PingFang SC"; src:local("PingFang SC"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#08090d; }
  [data-composition-id] {
    position:relative; width:1920px; height:1080px; color:#f6f2e8;
    background:
      radial-gradient(1000px 700px at 30% 45%, rgba(90,140,255,0.12), transparent 68%),
      radial-gradient(1100px 700px at 78% 30%, rgba(185,142,255,0.08), transparent 70%),
      linear-gradient(168deg, #0b1226 0%, #0a1120 46%, #0c1530 100%);
    font-family:"Noto Sans SC","PingFang SC",sans-serif; overflow:hidden;
  }
  .kicker { position:absolute; top:70px; left:120px; font-family:"Space Grotesk",monospace;
    font-size:24px; letter-spacing:0.22em; color:#aaa59a; z-index:3; }
  /* 相机层:整块画布做慢漂移(官方 launch 分镜 BEAT 1 手法) */
  #cam { position:absolute; inset:-80px; will-change:transform; }
  .shot { position:absolute; border-radius:18px; overflow:hidden;
    border:1px solid rgba(246,242,232,0.16); background:#0d0f14;
    box-shadow:0 40px 90px -30px rgba(0,0,0,0.65); }
  .shot .media { position:relative; width:100%; aspect-ratio:16/10; overflow:hidden; }
  .shot .bar { padding:16px 22px; font-family:"Space Grotesk",monospace; font-size:20px;
    letter-spacing:0.12em; color:#aaa59a; border-top:1px solid rgba(246,242,232,0.10);
    display:flex; gap:14px; }
  .shot .bar b { color:#b98eff; font-weight:700; }
  /* 占位媒体:接入真素材时整体换成 <video>/<img>(必须有 id!) */
  .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; font-family:"Space Grotesk",monospace; font-size:20px;
    letter-spacing:0.14em; color:rgba(246,242,232,0.5); line-height:2; }
  .ph-v1 { background:linear-gradient(135deg,#16233f 0%,#1b2f55 60%,#223a66 100%); }
  .ph-v2 { background:linear-gradient(135deg,#241b3a 0%,#33265a 60%,#3d2f6e 100%); }
  .ph-i1 { background:linear-gradient(135deg,#3a2a12 0%,#57401c 60%,#6b5222 100%); }
</style>
</head>
<body>
<div data-composition-id="tplmediacanvas" data-start="0" data-duration="8.5" data-width="1920" data-height="1080" data-fps="25">
  <div id="kicker" class="kicker clip" data-start="0" data-duration="8.5" data-track-index="0">素材画布 · TPL-MEDIA-CANVAS</div>

  <!-- 相机层:三张素材卡 + 慢漂移 -->
  <div id="cam" class="clip" data-start="0" data-duration="8.5" data-track-index="1">
    <!-- 卡1 主视频卡:换成 <video id="v1" src="media/你的.mp4" muted playsinline style="width:100%;display:block"> -->
    <div id="card1" class="shot" style="left:120px; top:160px; width:820px; transform:rotate(-3.2deg)">
      <div class="media"><div class="ph ph-v1">VIDEO · 替换为<br>&lt;video id="v1" src="media/…"&gt;</div></div>
      <div class="bar"><b>实拍 01</b><span>工作台第一视角</span></div>
    </div>
    <!-- 卡2 远景卡:DOF 失焦+去饱和(近实远虚) -->
    <div id="card2" class="shot" style="right:110px; top:120px; width:660px; transform:rotate(2.4deg)">
      <div class="media"><div class="ph ph-v2">VIDEO · 替换为<br>&lt;video id="v2" src="media/…"&gt;</div></div>
      <div class="bar"><b>实拍 02</b><span>侧栏巡览</span></div>
    </div>
    <!-- 卡3 图片卡:换 <img id="i1" src="media/….png"> -->
    <div id="card3" class="shot" style="left:380px; bottom:110px; width:720px; transform:rotate(1.8deg)">
      <div class="media"><div class="ph ph-i1">IMAGE · 替换为<br>&lt;img id="i1" src="media/…"&gt;</div></div>
      <div class="bar"><b>截图 03</b><span>成果提案卡</span></div>
    </div>
  </div>
</div>
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  // ── 参数区:节拍(秒)。对位旁白后只改这里 ──
  const T = { c1: 0.3, c2: 0.8, c3: 1.3, focus: 3.8 };

  const tl = gsap.timeline({ paused: true });

  // 相机慢漂移:整层对角位移 + 微旋转(ease:none,呼吸感由卡片承担)
  tl.to("#cam", { x: -64, y: -34, rotate: -0.8, scale: 1.03,
    duration: 8.5, ease: "none" }, 0);

  // 三卡依次滑入(对位「先看大画面,再看细节」的旁白结构)
  tl.from("#card1", { y: 96, opacity: 0, duration: 0.9, ease: "power3.out" }, T.c1);
  tl.from("#card2", { y: 96, opacity: 0, duration: 0.9, ease: "power3.out" }, T.c2);
  tl.from("#card3", { y: 96, opacity: 0, duration: 0.9, ease: "power3.out" }, T.c3);

  // 焦点节拍:主卡推近,两张副卡压暗退远(DOF 分层)
  tl.to("#card1", { scale: 1.04, duration: 0.7, ease: "power2.inOut" }, T.focus);
  tl.to(["#card2", "#card3"], { opacity: 0.55, filter: "saturate(0.8)",
    duration: 0.7, ease: "power2.inOut" }, T.focus);

  window.__timelines.tplmediacanvas = tl;
</script>
</body>
</html>
