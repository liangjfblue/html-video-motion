<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Noto Sans SC"; src:local("Noto Sans SC"); }
  @font-face { font-family:"PingFang SC"; src:local("PingFang SC"); }
  @font-face { font-family:"Space Grotesk"; src:local("Space Grotesk"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#08090d; }
  [data-composition-id] {
    position:relative; width:1920px; height:1080px; color:#f6f2e8;
    background:
      radial-gradient(900px 640px at 30% 40%, rgba(185,142,255,0.10), transparent 68%),
      radial-gradient(1100px 700px at 85% 30%, rgba(255,196,2,0.05), transparent 70%),
      linear-gradient(168deg, #0b1226 0%, #0a1120 46%, #0c1530 100%);
    font-family:"Noto Sans SC","PingFang SC",sans-serif; overflow:hidden;
  }
  .hex { position:absolute; inset:0; opacity:0.5;
    background:
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="112" height="194" viewBox="0 0 112 194"><g fill="none" stroke="rgba(246,242,232,0.05)" stroke-width="1.4"><path d="M28 1 L55 16.5 L55 48.5 L28 64 L1 48.5 L1 16.5 Z"/><path d="M84 1 L111 16.5 L111 48.5 L84 64 L57 48.5 L57 16.5 Z"/><path d="M28 65.5 L55 81 L55 113 L28 128.5 L1 113 L1 81 Z"/><path d="M84 65.5 L111 81 L111 113 L84 128.5 L57 113 L57 81 Z"/><path d="M28 130 L55 145.5 L55 177.5 L28 193 L1 177.5 L1 145.5 Z"/><path d="M84 130 L111 145.5 L111 177.5 L84 193 L57 177.5 L57 145.5 Z"/></g></svg>') repeat;
  }
  .kicker { position:absolute; top:64px; left:96px; font-size:44px; letter-spacing:9px; color:#b98eff; opacity:0; }
  h1 { position:absolute; top:110px; left:96px; font-size:104px; font-weight:900; color:#fff; opacity:0; }
  h1 b { color:#ffc402; }
  .tower { position:absolute; left:96px; top:270px; width:1728px; display:flex; flex-direction:column; gap:16px; }
  .row { display:flex; align-items:center; gap:44px; padding:20px 48px; border-radius:22px;
    background:rgba(246,242,232,0.055); border:2px solid rgba(246,242,232,0.15); opacity:0; }
  .row .n { font-family:"Space Grotesk",monospace; font-size:58px; font-weight:700; color:#ffc402; width:130px; }
  .row b { font-size:54px; color:#fff; font-weight:800; letter-spacing:6px; }
  .row .bar { flex:1; height:8px; border-radius:4px; background:rgba(246,242,232,.1); overflow:hidden; }
  .row .bar i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#b98eff,#ffc402);
    transform:translateX(-101%); }
</style>
</head>
<body>
<div data-composition-id="dublist" data-start="0" data-duration="14" data-width="1920" data-height="1080" data-fps="25">
  <div class="hex"></div>
  <div class="kicker" id="k">AI 配音其实没有什么玄学</div>
  <h1 id="h">整个流程就是 <b>六步排障</b></h1>
  <div class="tower" id="tower"></div>
</div>
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script>
  const STEPS = ["改文本", "控停顿", "语速情绪", "克隆音色", "链路干净", "质检"];
  const tower = document.getElementById("tower");
  STEPS.forEach((t, i) => {
    const r = document.createElement("div");
    r.className = "row"; r.id = "r" + i;
    r.innerHTML = `<span class="n">0${i + 1}</span><b>${t}</b><span class="bar"><i id="bar${i}"></i></span>`;
    tower.appendChild(r);
  });
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to("#k", { opacity: 1, duration: 0.35 }, 0.4);
  tl.to("#h", { opacity: 1, duration: 0.45 }, 0.9);
  // 六行随口播逐条亮起（行滑入 + 金条填满）
  STEPS.forEach((_, i) => {
    const at = 3.4 + i * 0.95;
    tl.to("#r" + i, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, at)
      .from("#r" + i, { x: -60 }, at)
      .to("#bar" + i + " i", { transform: "translateX(0%)", duration: 0.6, ease: "power2.out" }, at + 0.1);
  });
  // 全塔金边呼吸定格
  STEPS.forEach((_, i) => {
    tl.to("#r" + i, { borderColor: "rgba(255,196,2,0.65)", duration: 0.25 }, 9.4 + i * 0.06);
  });
  window.__timelines.dublist = tl;
</script>
</body>
</html>
