<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Space Grotesk"; src:url("../fonts/space-grotesk-500-normal.woff2") format("woff2"); font-weight:500; }
  @font-face { font-family:"Space Grotesk"; src:url("../fonts/space-grotesk-700-normal.woff2") format("woff2"); font-weight:700; }
  @font-face { font-family:"Noto Sans SC"; src:local("Noto Sans SC"); }
  @font-face { font-family:"PingFang SC"; src:local("PingFang SC"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#08090d; }
  [data-composition-id] {
    position:relative; width:1920px; height:1080px; color:#f6f2e8;
    background:
      radial-gradient(900px 640px at 26% 58%, rgba(90,140,255,0.14), transparent 68%),
      radial-gradient(1100px 700px at 82% 30%, rgba(185,142,255,0.08), transparent 70%),
      linear-gradient(168deg, #0b1226 0%, #0a1120 46%, #0c1530 100%);
    font-family:"Noto Sans SC","PingFang SC",sans-serif; overflow:hidden;
  }
  .grid { position:absolute; inset:0; opacity:0.5;
    background:
      repeating-linear-gradient(0deg, rgba(148,180,255,0.055) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(90deg, rgba(148,180,255,0.055) 0 1px, transparent 1px 72px);
    mask-image:radial-gradient(1200px 800px at 40% 50%, #000 40%, transparent 100%);
  }
  .glow { position:absolute; inset:0;
    background:radial-gradient(700px 480px at 30% 62%, rgba(56,132,255,0.10), transparent 70%); }
  .kicker { position:absolute; top:70px; left:120px;
    font-family:"Space Grotesk",monospace; font-size:24px; font-weight:500;
    letter-spacing:0.22em; color:#aaa59a; }
  .hot { position:absolute; top:64px; right:120px; padding:10px 26px;
    border:1.5px solid #ffc402; border-radius:999px; color:#ffc402;
    font-family:"Space Grotesk",monospace; font-size:24px; letter-spacing:0.18em; }
  .left { position:absolute; left:120px; top:0; height:100%; width:860px;
    display:flex; flex-direction:column; justify-content:center; }
  .pre { font-size:42px; color:#c8cede; letter-spacing:0.04em; }
  .pre .subj { color:#ffc402; font-weight:700; }
  .stamp { margin-top:20px; font-size:118px; font-weight:900; line-height:1.08; color:#f6f2e8; }
  .mine { margin-top:26px; font-size:54px; font-weight:700; color:#f6f2e8; }
  .final { margin-top:14px; font-size:74px; font-weight:900; color:#f6f2e8; opacity:0; }
  .memo-wrap { position:relative; color:#ffc402; }
  .memo-wrap i { position:absolute; left:0; bottom:-12px; height:8px; width:100%;
    background:#ffc402; transform:scaleX(0); transform-origin:left; border-radius:4px; }
  .chips { position:absolute; left:120px; bottom:96px; display:flex; gap:26px; }
  .chip { padding:16px 34px; border:1.5px solid rgba(185,142,255,0.65); border-radius:999px;
    font-size:30px; color:#e9e2f8; background:rgba(185,142,255,0.08); }
  .chip b { color:#b98eff; font-family:"Space Grotesk",sans-serif; margin-right:10px; }
  .shot { position:absolute; right:96px; top:50%; transform:translateY(-50%);
    width:760px; border:1px solid rgba(246,242,232,0.16); border-radius:18px;
    background:#0d0f14; overflow:hidden; }
  .shot img { width:100%; display:block; }
  .shot figcaption { padding:16px 22px; font-size:22px; color:#aaa59a; letter-spacing:0.1em;
    border-top:1px solid rgba(246,242,232,0.10); font-family:"Space Grotesk",monospace; }
</style>
</head>
<body>
<div data-composition-id="b01hook" data-start="0" data-duration="8.1" data-width="1920" data-height="1080" data-fps="25">
  <div class="grid"></div>
  <div class="glow"></div>
  <div id="kicker" class="kicker clip" data-start="0" data-duration="8.1" data-track-index="0">AGENT 工作台</div>
  <div id="hot" class="hot clip" data-start="0" data-duration="8.1" data-track-index="0">🔥 最近挺火</div>

  <div id="left" class="left clip" data-start="0" data-duration="8.1" data-track-index="1">
    <div class="pre">最近 <b class="subj">这个</b> Agent 工作台，不是挺火嘛</div>
    <div class="stamp">我也<span class="gold">装了</span>一个</div>
    <div class="mine">但我这个，有点不一样——</div>
    <div class="final" id="final">它会<span class="memo-wrap">记得我<i id="memo-line"></i></span>。</div>
  </div>

  <div id="chips" class="chips clip" data-start="0" data-duration="8.1" data-track-index="2">
    <div class="chip" id="c1"><b>01</b>会记知识</div>
    <div class="chip" id="c2"><b>02</b>追项目</div>
    <div class="chip" id="c3"><b>03</b>提案我确认</div>
  </div>

  <figure id="shot" class="shot clip" data-start="0" data-duration="8.1" data-track-index="3">
    <img src="../media/proposal-card.png" alt="" />
    <figcaption>真实画面 · 成果提案</figcaption>
  </figure>
</div>
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  tl.from("#kicker", { opacity: 0, y: -16, duration: 0.3 }, 0);
  tl.from("#hot",    { opacity: 0, scale: 0.85, duration: 0.35 }, 0.15);

  // 右侧真实提案卡滑入
  tl.from("#shot", { opacity: 0, x: 90, duration: 0.55 }, 0.55);

  // 主文案（对位旁白：0.29 挺火嘛 / 3.56 我也装了一个 / 4.86 有点不一样 / 6.95 它会记得我）
  tl.from("#left .pre",   { opacity: 0, y: 24, duration: 0.35 }, 0.35);
  tl.from("#left .stamp", { opacity: 0, scale: 0.9, duration: 0.5, ease: "power3.out" }, 3.5);
  tl.from("#left .mine",  { opacity: 0, y: 26, duration: 0.4 }, 4.85);
  tl.to("#final",  { opacity: 1, duration: 0.3 }, 6.9);
  tl.to("#memo-line", { scaleX: 1, duration: 0.45, ease: "power2.out" }, 7.05);

  // 底部三个关键词 chip 依次飞入
  tl.from("#c1", { opacity: 0, y: 40, duration: 0.35 }, 6.75);
  tl.from("#c2", { opacity: 0, y: 40, duration: 0.35 }, 7.1);
  tl.from("#c3", { opacity: 0, y: 40, duration: 0.35 }, 7.45);

  window.__timelines.b01hook = tl;
</script>
</body>
</html>
