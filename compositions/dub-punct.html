<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:"Noto Sans SC"; src:local("Noto Sans SC"); }
  @font-face { font-family:"PingFang SC"; src:local("PingFang SC"); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:#08090d; }
  [data-composition-id] {
    position:relative; width:1920px; height:1080px; color:#f6f2e8;
    background:
      radial-gradient(900px 640px at 30% 40%, rgba(185,142,255,0.12), transparent 68%),
      linear-gradient(168deg, #0b1226 0%, #0a1120 46%, #0c1530 100%);
    font-family:"Noto Sans SC","PingFang SC",sans-serif; overflow:hidden;
  }
  .grid { position:absolute; inset:0; opacity:0.45;
    background:
      repeating-linear-gradient(0deg, rgba(148,180,255,0.05) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(90deg, rgba(148,180,255,0.05) 0 1px, transparent 1px 72px);
    mask-image:radial-gradient(1200px 800px at 40% 50%, #000 40%, transparent 100%);
  }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .kicker { font-size:46px; letter-spacing:9px; color:#b98eff; margin-bottom:40px; opacity:0; }
  .script { font-size:88px; line-height:2.1; color:#f6f2e8; font-weight:600; max-width:1650px; text-align:center; }
  .script b { opacity:0; display:inline-block; }
  .gold { margin-top:70px; font-size:52px; color:#ffc402; border:2px dashed #ffc402; border-radius:20px;
          padding:30px 70px; opacity:0; }
</style>
</head>
<body>
<div data-composition-id="dubpunct" data-start="0" data-duration="14" data-width="1920" data-height="1080" data-fps="25">
  <div class="grid"></div>
  <div class="wrap">
    <div class="kicker" id="k">能连着说的句子</div>
    <div class="script" id="sc">我现在的标准是<b id="c1">，</b>能连着说的句子<b id="c2">，</b>中间标点<b id="c3">，</b>全部删掉。</div>
    <div class="gold" id="g">整条片子只留五个大的戏剧停顿</div>
  </div>
</div>
<script src="../vendor/gsap/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.to("#k", { opacity: 1, duration: 0.4 }, 0.4);
  tl.to("#sc", { opacity: 1, duration: 0.01 }, 0.01);
  tl.from("#sc", { y: 30, duration: 0.5, ease: "power3.out" }, 0.05);
  // 标点先入场亮红（问题提示）
  tl.to("#c1", { opacity: 1, color: "#FF5A5A", duration: 0.25 }, 1.3);
  tl.to("#c2", { opacity: 1, color: "#FF5A5A", duration: 0.25 }, 1.5);
  tl.to("#c3", { opacity: 1, color: "#FF5A5A", duration: 0.25 }, 1.7);
  tl.to("#c1", { color: "#ffc402", duration: 0.2 }, 2.4);
  tl.to("#c2", { color: "#ffc402", duration: 0.2 }, 2.6);
  tl.to("#c3", { color: "#ffc402", duration: 0.2 }, 2.8);
  // 逐个消失
  tl.to("#c1", { opacity: 0, scale: 2.4, duration: 0.35, ease: "power2.in" }, 4.2);
  tl.to("#c2", { opacity: 0, scale: 2.4, duration: 0.35, ease: "power2.in" }, 4.8);
  tl.to("#c3", { opacity: 0, scale: 2.4, duration: 0.35, ease: "power2.in" }, 5.4);
  // 金框结论
  tl.to("#g", { opacity: 1, duration: 0.5 }, 8.2);
  // 定格 5s+
  window.__timelines.dubpunct = tl;
</script>
</body>
</html>
